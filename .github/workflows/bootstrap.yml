name: Bootstrap FenceProof source (one-time)
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and import source package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.tar.xz.b64 > /tmp/fenceproof-source.tar.xz
          echo 'a09c254dcda84d01e0f330037977f75c9ba08e1db7e0e5ec2c39a9c4fcdc3820  /tmp/fenceproof-source.tar.xz' | sha256sum --check
          tar -tJf /tmp/fenceproof-source.tar.xz >/dev/null
          tar -xJf /tmp/fenceproof-source.tar.xz
          # Repository workflows are added separately via GitHub integration.
          rm -f .github/workflows/ci.yml .github/workflows/release.yml
          rm -rf .bootstrap
          python3 -m compileall -q src tests
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          PYTHONPATH=src python3 -m fenceproof check --policy examples/secure-policy.json --fail-on low
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publish FenceProof v1.0.0 source, tests and documentation'
          git push origin HEAD:main
