name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python pinned action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Verify secure policy
        run: python -m fenceproof check --policy examples/secure-policy.json --fail-on low
        env:
          PYTHONPATH: src
      - name: Generate and parse SARIF
        run: |
          python -m fenceproof check --policy examples/secure-policy.json --format sarif --output scan.sarif
          python -c "import json; d=json.load(open('scan.sarif')); assert d['version']=='2.1.0' and d['runs'][0]['tool']['driver']['name']=='FenceProof'"
        env:
          PYTHONPATH: src
